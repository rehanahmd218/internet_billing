<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add / Edit Bill</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 flex items-center justify-between bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm p-4 border-b border-slate-200 dark:border-slate-800">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors text-slate-900 dark:text-white">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight text-center flex-1 text-slate-900 dark:text-white">New Bill</h2>
<button class="flex h-10 items-center justify-center px-2 text-primary font-semibold text-base">
                Help
            </button>
</header>
<!-- Main Form Content -->
<main class="flex-1 w-full max-w-[600px] mx-auto p-4 pb-32 flex flex-col gap-6">
<!-- Customer Section (Read Only) -->
<div class="flex flex-col gap-2">
<label class="text-base font-medium text-slate-900 dark:text-slate-100">Customer</label>
<div class="relative flex w-full items-center rounded-xl bg-slate-100 dark:bg-slate-800/50 border border-transparent dark:border-slate-700 opacity-80">
<input class="flex w-full min-w-0 flex-1 bg-transparent border-none focus:ring-0 text-slate-500 dark:text-slate-400 h-14 px-4 text-base font-medium rounded-xl cursor-not-allowed" readonly="" type="text" value="Alex Morgan (ID: #4023)"/>
<div class="flex items-center justify-center pr-4 text-slate-400">
<span class="material-symbols-outlined">lock</span>
</div>
</div>
</div>
<!-- Billing Period Section -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="text-base font-medium text-slate-900 dark:text-slate-100">Month</label>
<div class="relative">
<select class="w-full appearance-none rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white h-14 pl-4 pr-10 text-base focus:border-primary focus:ring-primary">
<option>January</option>
<option>February</option>
<option>March</option>
<option>April</option>
<option>May</option>
<option>June</option>
<option>July</option>
<option>August</option>
<option selected="">September</option>
<option>October</option>
<option>November</option>
<option>December</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-base font-medium text-slate-900 dark:text-slate-100">Year</label>
<div class="relative">
<select class="w-full appearance-none rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white h-14 pl-4 pr-10 text-base focus:border-primary focus:ring-primary">
<option>2022</option>
<option selected="">2023</option>
<option>2024</option>
<option>2025</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">expand_more</span>
</div>
</div>
</div>
<!-- Amount Section -->
<div class="flex flex-col gap-2">
<label class="text-base font-medium text-slate-900 dark:text-slate-100">Bill Amount</label>
<div class="relative flex w-full items-center rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<div class="flex items-center justify-center pl-4 text-slate-500">
<span class="material-symbols-outlined">attach_money</span>
</div>
<input class="flex w-full min-w-0 flex-1 bg-transparent border-none focus:ring-0 text-slate-900 dark:text-white h-14 px-2 text-lg font-semibold placeholder:text-slate-400 placeholder:font-normal" inputmode="decimal" placeholder="0.00" type="number" value="50.00"/>
</div>
</div>
<!-- Status & Date Section -->
<div class="flex flex-col gap-4 p-4 rounded-2xl bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700/50">
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wide">Payment Status</label>
<div class="flex h-12 w-full items-center rounded-xl bg-slate-100 dark:bg-slate-900/50 p-1">
<!-- Radio Inputs for Segmented Control Logic -->
<label class="cursor-pointer relative flex-1 h-full">
<input class="peer sr-only" name="status" type="radio" value="pending"/>
<div class="flex h-full w-full items-center justify-center rounded-lg text-sm font-medium text-slate-500 transition-all peer-checked:bg-white peer-checked:text-slate-900 peer-checked:shadow-sm dark:text-slate-400 dark:peer-checked:bg-slate-700 dark:peer-checked:text-white">
                                Pending
                            </div>
</label>
<label class="cursor-pointer relative flex-1 h-full">
<input checked="" class="peer sr-only" name="status" type="radio" value="paid"/>
<div class="flex h-full w-full items-center justify-center rounded-lg text-sm font-medium text-slate-500 transition-all peer-checked:bg-primary peer-checked:text-white peer-checked:shadow-md dark:text-slate-400">
                                Paid
                            </div>
</label>
</div>
</div>
<!-- Conditional Date Input (Visible because 'Paid' is checked in mock) -->
<div class="flex flex-col gap-2 mt-2 pt-4 border-t border-slate-100 dark:border-slate-700">
<label class="text-base font-medium text-slate-900 dark:text-slate-100">Date Received</label>
<div class="relative">
<input class="w-full rounded-xl bg-background-light dark:bg-slate-900 border border-slate-200 dark:border-slate-600 text-slate-900 dark:text-white h-14 px-4 text-base focus:border-primary focus:ring-primary [color-scheme:light] dark:[color-scheme:dark]" type="date" value="2023-09-15"/>
</div>
</div>
</div>
<!-- Notes Section -->
<div class="flex flex-col gap-2">
<label class="text-base font-medium text-slate-900 dark:text-slate-100">
                    Notes <span class="text-slate-400 font-normal text-sm ml-1">(Optional)</span>
</label>
<textarea class="w-full resize-none rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white p-4 text-base focus:border-primary focus:ring-primary h-32 placeholder:text-slate-400" placeholder="Add internal notes about this transaction..."></textarea>
</div>
</main>
<!-- Fixed Footer Actions -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 z-20">
<div class="flex gap-4 max-w-[600px] mx-auto">
<button class="flex-1 h-12 rounded-xl border border-slate-300 dark:border-slate-600 bg-transparent text-slate-700 dark:text-slate-300 font-semibold text-base hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    Cancel
                </button>
<button class="flex-[2] h-12 rounded-xl bg-primary text-white font-semibold text-base hover:bg-blue-600 shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                    Save Bill
                </button>
</div>
</div>
</div>
</body></html>
