<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                        "card-light": "#ffffff",
                        "card-dark": "#1a202c",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem", 
                        "lg": "0.75rem", 
                        "xl": "1rem", 
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<script>
        // Simple script to toggle dark mode for demonstration
        function toggleTheme() {
            const html = document.querySelector('html');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
            } else {
                html.classList.add('dark');
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto overflow-x-hidden pb-10">
<!-- Top App Bar -->
<div class="sticky top-0 z-10 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm px-4 py-3 flex items-center justify-between border-b border-gray-200 dark:border-gray-800">
<div class="flex items-center gap-3">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-white" style="font-size: 24px;">arrow_back</span>
</button>
<h2 class="text-xl font-bold leading-tight tracking-tight text-slate-900 dark:text-white">Settings</h2>
</div>
<!-- Optional: User avatar or profile link could go here -->
</div>
<!-- Section: Data Management -->
<div class="flex flex-col mt-4">
<h3 class="px-6 py-2 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Data Management</h3>
<div class="px-4 space-y-3">
<!-- Action Panel: Backup -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 rounded-2xl border border-gray-200 dark:border-gray-700 bg-card-light dark:bg-card-dark p-4 shadow-sm">
<div class="flex items-start gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-blue-50 dark:bg-blue-900/30 text-primary">
<span class="material-symbols-outlined" style="font-size: 20px;">cloud_upload</span>
</div>
<div class="flex flex-col">
<p class="text-sm font-bold text-slate-900 dark:text-white">Backup Data</p>
<p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Export your customers and billing history to a secure file.</p>
</div>
</div>
<button class="mt-2 sm:mt-0 w-full sm:w-auto flex cursor-pointer items-center justify-center rounded-lg h-9 px-4 bg-primary hover:bg-blue-700 text-white text-sm font-medium transition-colors">
                        Backup
                    </button>
</div>
<!-- Action Panel: Restore -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 rounded-2xl border border-gray-200 dark:border-gray-700 bg-card-light dark:bg-card-dark p-4 shadow-sm">
<div class="flex items-start gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-blue-50 dark:bg-blue-900/30 text-primary">
<span class="material-symbols-outlined" style="font-size: 20px;">restore</span>
</div>
<div class="flex flex-col">
<p class="text-sm font-bold text-slate-900 dark:text-white">Restore Data</p>
<p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Import database from a backup file. Existing data will be overwritten.</p>
</div>
</div>
<button class="mt-2 sm:mt-0 w-full sm:w-auto flex cursor-pointer items-center justify-center rounded-lg h-9 px-4 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-slate-700 dark:text-white hover:bg-gray-50 dark:hover:bg-gray-600 text-sm font-medium transition-colors">
                        Restore
                    </button>
</div>
</div>
</div>
<!-- Section: App Preferences -->
<div class="flex flex-col mt-6">
<h3 class="px-6 py-2 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">App Preferences</h3>
<div class="mx-4 overflow-hidden rounded-2xl border border-gray-200 dark:border-gray-700 bg-card-light dark:bg-card-dark shadow-sm divide-y divide-gray-100 dark:divide-gray-700">
<!-- Currency Setting -->
<button class="w-full flex items-center justify-between p-4 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors group">
<div class="flex items-center gap-3">
<div class="flex h-8 w-8 items-center justify-center rounded-lg bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400">
<span class="material-symbols-outlined" style="font-size: 20px;">currency_rupee</span> <!-- Using rupee as closest symbol to generic/PKR visual if PKR specific isn't available in standard set, or just generic currency -->
</div>
<span class="text-sm font-medium text-slate-900 dark:text-white">Currency</span>
</div>
<div class="flex items-center gap-2">
<span class="text-sm text-slate-500 dark:text-slate-400">PKR</span>
<span class="material-symbols-outlined text-slate-400" style="font-size: 20px;">chevron_right</span>
</div>
</button>
<!-- Theme Toggle -->
<div class="w-full flex items-center justify-between p-4">
<div class="flex items-center gap-3">
<div class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400">
<span class="material-symbols-outlined" style="font-size: 20px;">dark_mode</span>
</div>
<span class="text-sm font-medium text-slate-900 dark:text-white">Dark Mode</span>
</div>
<!-- Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" onchange="toggleTheme()" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
</div>
</div>
<!-- Section: Information -->
<div class="flex flex-col mt-6">
<h3 class="px-6 py-2 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Information</h3>
<div class="mx-4 overflow-hidden rounded-2xl border border-gray-200 dark:border-gray-700 bg-card-light dark:bg-card-dark shadow-sm">
<!-- About App -->
<button class="w-full flex items-center justify-between p-4 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
<div class="flex items-center gap-3">
<div class="flex h-8 w-8 items-center justify-center rounded-lg bg-orange-50 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400">
<span class="material-symbols-outlined" style="font-size: 20px;">info</span>
</div>
<span class="text-sm font-medium text-slate-900 dark:text-white">About App</span>
</div>
<span class="material-symbols-outlined text-slate-400" style="font-size: 20px;">chevron_right</span>
</button>
</div>
</div>
<!-- Version Footer -->
<div class="mt-8 mb-4 text-center">
<p class="text-xs text-slate-400 dark:text-slate-500 font-medium">NetManager v1.0.2</p>
<p class="text-[10px] text-slate-300 dark:text-slate-600 mt-1">Designed for iOS</p>
</div>
</div>
</body></html>
