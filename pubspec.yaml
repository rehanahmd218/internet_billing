name: internet_billing
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  sqflite: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.5
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  file_picker: ^11.0.2
  googleapis: ^16.0.0
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  
  # Google Drive API for cloud backup

 

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  # Optional: Settings for Android Adaptive Icons
  adaptive_icon_background: "#0D47A1" # A dark blue background
  adaptive_icon_foreground: "assets/icon/icon.png"